server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback: /sessions/3 and /auth/callback are client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
